<!DOCTYPE html>
<html lang="es">

    <head>

        <title>Plataforma Centro Educativo</title>
        <meta charset= "UTF-8">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <header>
            <h1>Portal Centro Educativo</h1>
            <h2>Bienvenido</h2>

            <a class = "login" href="login.html">Iniciar sesión</a>

        </header>

        <main>
            <section id="loggear">
                <form action="#" method="post">
                    <legend>Datos personales</legend>
                    <fieldset>
                        <p>Nombre: <input type="text" id="Nombre" name="Nombre" required placeholder="Inserta tu nombre"> &nbsp;&nbsp;&nbsp;
                        Primer apellido: <input type="text" id="Primer_apellido" name="Primer_apellido" required placeholder="Inserta tu primer apellido"> &nbsp;&nbsp;&nbsp;
                        Segundo apellido: <input type="text" id="Segundo_apellido" name="Segundo_apellido" required placeholder="Inserta tu segundo apellido"></p>
                        <p>Correo electrónico: <input type="email" id="Correo" name="Correo" required placeholder="Inserta tu correo electrónico"></p>
                        <p>Contraseña: <input type="text" id="Contraseña" name="Contraseña" required placeholder="Inserta tu contraseña"> &nbsp;&nbsp;&nbsp;
                        Confirmar contraseña: <input type="text" id="Confirmar_contraseña" name="Confirmar_contraseña" required placeholder="Confirma tu contraseña"></p>
                        <button type="submit"> Registrarme</button>
                    </fieldset>
                </form>
            </section>
        </main>

        <footer>


            
        </footer>
        <script src="js/script.js"></script>
    </body>

</html>
