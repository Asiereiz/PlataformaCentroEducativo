<!DOCTYPE html>
<html lang="es">

    <head>

        <title>Plataforma Centro Educativo</title>
        <meta charset= "UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>

    <body>

        <header>
            <h1><a class="titulo" href="index.html">Portal Centro Educativo</a></h1>
            <h2><a class="titulo" href="index.html">Bienvenido</a></h2>

            <a id="login" href="login.html">Iniciar sesión</a>

            <nav id="migapan">
                <a href="portal.html">Inicio</a>
                <span>&nbsp;&gt;&nbsp;</span>
                <a href="registro.html">Registrarme</a>
            </nav>

        </header>

        <main>
            <section id="loggear">
                <form id="formregistro" action="#" method="post">
                    <legend>Datos personales</legend>
                    <fieldset>
                        <label for="Nombre">Nombre: <input type="text" id="Nombre" name="Nombre" required placeholder="Inserta tu nombre"> &nbsp;&nbsp;&nbsp;</label>
                        <label for="Primer_apellido">Primer apellido: <input type="text" id="Primer_apellido" name="Primer_apellido" required placeholder="Inserta tu primer apellido"> &nbsp;&nbsp;&nbsp;</label>
                        <label for="Segundo_apellido">Segundo apellido: <input type="text" id="Segundo_apellido" name="Segundo_apellido" required placeholder="Inserta tu segundo apellido"></label>
                        <label for="Correo">Correo electrónico: <input type="email" id="Correo" name="Correo" required placeholder="Inserta tu correo electrónico"></label>
                        <label for="Contraseña">Contraseña: <input type="text" id="Contraseña" name="Contraseña" required placeholder="Inserta tu contraseña"> &nbsp;&nbsp;&nbsp;</label>
                        <label for="Confirmar_contraseña">Confirmar contraseña: <input type="text" id="Confirmar_contraseña" name="Confirmar_contraseña" required placeholder="Confirma tu contraseña"></label>
                        <button type="submit"> Registrarme</button>
                    </fieldset>
                </form>
            </section>
        </main>

        <footer>
            <span>Contacta con nosotros una vez hayas iniciado sesión.</span>
        </footer>

        <script src="js/script.js"></script>
    </body>

</html>
